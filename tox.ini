
[tox]
envlist = lint,py3

[package]
name = pgq
deps =
    psycopg2-binary==2.9.10
    skytools==3.9.2
test_deps =
    coverage==7.6.10
    pytest==8.3.4
    pytest-cov==6.0.0
lint_deps =
    mypy==1.14.1
    pyflakes==3.2.0
    typing-extensions==4.12.2
    types-setuptools==75.6.0.20241229
    types-psycopg2==2.9.21.20241019
xlint_deps =
    pylint==2.17.5
    pytype==2023.8.22

[testenv]
changedir = {envsitepackagesdir}
deps =
    {[package]deps}
    {[package]test_deps}
passenv =
    TEST_Q_NAME
    PGPORT
    PGHOST
    PGUSER
    PGDATABASE
commands =
    pytest \
        --cov=pgq \
        --cov-report=term \
        --cov-report=xml:{toxinidir}/cover/coverage.xml \
        --cov-report=html:{toxinidir}/cover/{envname} \
        {toxinidir}/tests \
        {posargs}

[testenv:lint]
basepython = python3
changedir = {toxinidir}
deps =
    {[package]deps}
    {[package]lint_deps}
commands =
    pyflakes {[package]name}
    mypy {[package]name}

[testenv:xlint]
basepython = python3.14
changedir = {toxinidir}
deps =
    {[package]deps}
    {[package]lint_deps}
    {[package]xlint_deps}
commands =
    pylint {[package]name}
    pytype {[package]name}

