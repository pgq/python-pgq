
[tox]
envlist = lint,py3

[package]
name = pgq
deps =
    psycopg2-binary>=2.9.9
    skytools>=3.9.2
test_deps =
    coverage>=7.6.0
    pytest>=8.0.0
    pytest-cov>=5.0.0
lint_deps =
    mypy>=1.10.0
    pyflakes>=3.2.0
    typing-extensions>=4.10.0
    types-setuptools
    types-psycopg2
xlint_deps =
    pylint==2.17.5
    pytype==2023.8.22

[testenv]
changedir = {envsitepackagesdir}
deps =
    {[package]deps}
    {[package]test_deps}
passenv =
    TEST_Q_NAME
    PGPORT
    PGHOST
    PGUSER
    PGDATABASE
commands =
    pytest \
        --cov=pgq \
        --cov-report=term \
        --cov-report=xml:{toxinidir}/cover/coverage.xml \
        --cov-report=html:{toxinidir}/cover/{envname} \
        {toxinidir}/tests \
        {posargs}

[testenv:lint]
basepython = python3
changedir = {toxinidir}
deps =
    {[package]deps}
    {[package]lint_deps}
commands =
    pyflakes {[package]name}
    mypy {[package]name}

[testenv:xlint]
basepython = python3.14
changedir = {toxinidir}
deps =
    {[package]deps}
    {[package]lint_deps}
    {[package]xlint_deps}
commands =
    pylint {[package]name}
    pytype {[package]name}

